name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the major tag
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.MASTER_RELEASE_TOKEN }}

      - name: Point major tag at the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MAJOR_TAG: v${{ steps.release.outputs.major }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          if gh api "repos/$REPOSITORY/git/ref/tags/$MAJOR_TAG" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$REPOSITORY/git/refs/tags/$MAJOR_TAG" -f sha="$SHA" -F force=true > /dev/null
          else
            gh api --method POST "repos/$REPOSITORY/git/refs" -f ref="refs/tags/$MAJOR_TAG" -f sha="$SHA" > /dev/null
          fi
          echo "$MAJOR_TAG -> $SHA"
