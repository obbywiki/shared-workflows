name: release-please

# Call from a workflow triggered by push to the default branch. Uses the OW Bot app, so release PRs and tags show as the bot and trigger CI (a github.token release PR does not).

on:
  workflow_call:
    inputs:
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json
    secrets:
      client-id:
        description: OW Bot client ID (OW_BOT_CLIENT_ID)
        required: true
      private-key:
        description: OW Bot private key (OW_BOT_PRIVATE_KEY)
        required: true
    outputs:
      release-created:
        description: Whether this run created a release
        value: ${{ jobs.release-please.outputs.release-created }}
      tag-name:
        description: Tag of the created release
        value: ${{ jobs.release-please.outputs.tag-name }}

permissions: {}

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.client-id }}
          private-key: ${{ secrets.private-key }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
