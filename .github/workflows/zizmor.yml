name: zizmor

on:
  workflow_call:
    inputs:
      always-use-default-config:
        description: Ignore a caller-provided config and use the shared default
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check out shared configuration
        if: ${{ inputs.always-use-default-config || hashFiles('zizmor.yml', '.github/zizmor.yml') == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: obbywiki/shared-workflows
          ref: main
          path: .shared-workflows
          persist-credentials: false
          sparse-checkout: |
            .github/zizmor.yml
          sparse-checkout-cone-mode: false

      - name: Select zizmor configuration
        id: config
        shell: bash
        env:
          FORCE_DEFAULT: ${{ inputs.always-use-default-config }}
        run: |
          if [[ "${FORCE_DEFAULT}" != "true" && -f zizmor.yml ]]; then
            echo "path=zizmor.yml" >> "${GITHUB_OUTPUT}"
            echo "Using caller configuration: zizmor.yml"
          elif [[ "${FORCE_DEFAULT}" != "true" && -f .github/zizmor.yml ]]; then
            echo "path=.github/zizmor.yml" >> "${GITHUB_OUTPUT}"
            echo "Using caller configuration: .github/zizmor.yml"
          else
            echo "path=.shared-workflows/.github/zizmor.yml" >> "${GITHUB_OUTPUT}"
            echo "Using shared default configuration"
          fi

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482
        with:
          inputs: .github/workflows
          config: ${{ steps.config.outputs.path }}
          advanced-security: ${{ !github.event.repository.private }}
          annotations: ${{ github.event.repository.private }}
