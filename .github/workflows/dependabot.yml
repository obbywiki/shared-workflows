name: Dependabot

on:
  workflow_call:
    inputs:
      rebuild:
        description: Rebuild and commit the bundle when a dependency update changes it
        type: boolean
        default: false
      build-command:
        description: Command that builds the bundle, run after pnpm install
        type: string
        default: pnpm build
      dist-path:
        description: Directory holding the committed bundle
        type: string
        default: resources/dist
      auto-merge:
        description: Turn on auto-merge; the branch's required checks still gate the merge
        type: boolean
        default: true
      auto-merge-majors:
        description: Also auto-merge semver-major updates
        type: boolean
        default: false
      merge-method:
        description: squash, merge or rebase
        type: string
        default: squash
    secrets:
      app-id:
        description: OW Bot app ID (OW_BOT_APP_ID)
        required: true
      private-key:
        description: OW Bot private key (OW_BOT_PRIVATE_KEY)
        required: true

permissions: {}

jobs:
  build:
    name: Build bundle
    if: inputs.rebuild && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -c "$BUILD_COMMAND"
      - id: diff
        env:
          DIST_PATH: ${{ inputs.dist-path }}
        # --porcelain also catches new files, which git diff misses.
        run: |
          if [ -z "$(git status --porcelain -- "$DIST_PATH")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ${{ inputs.dist-path }}
          include-hidden-files: true
          retention-days: 1

  commit:
    name: Commit rebuilt bundle
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.private-key }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Replace bundle with the rebuilt one
        env:
          DIST_PATH: ${{ inputs.dist-path }}
        run: rm -rf -- "$DIST_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ inputs.dist-path }}
      # the GraphQL API signs commits made with an app token. expectedHeadOid makes this fail, rather than overwrite, if Dependabot pushed to the branch since the build
      - name: Commit rebuilt bundle
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DIST_PATH: ${{ inputs.dist-path }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git add --all -- "$DIST_PATH"
          changes=$(mktemp)
          while IFS= read -r -d '' path; do
            if [ -e "$path" ]; then
              jq -cn --arg path "$path" --rawfile contents <(base64 -w0 < "$path") \
                '{addition: {path: $path, contents: $contents}}'
            else
              jq -cn --arg path "$path" '{deletion: {path: $path}}'
            fi >> "$changes"
          done < <(git diff --cached --no-renames --name-only -z)
          jq -s \
            --arg repo "$REPOSITORY" --arg branch "$BRANCH" --arg head "$HEAD_SHA" '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: "chore: rebuild bundle"},
                fileChanges: {
                  additions: [.[] | .addition | select(.)],
                  deletions: [.[] | .deletion | select(.)]
                }
              }}
            }' "$changes" | gh api graphql --input - --jq .data.createCommitOnBranch.commit.url

  auto-merge:
    name: Enable auto-merge
    if: inputs.auto-merge && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.private-key }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ steps.token.outputs.token }}
      - if: inputs.auto-merge-majors || steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_METHOD: ${{ inputs.merge-method }}
        run: |
          case "$MERGE_METHOD" in
            squash | merge | rebase) ;;
            *) echo "::error::merge-method must be squash, merge or rebase, not '$MERGE_METHOD'"; exit 1 ;;
          esac
          gh pr merge --auto "--$MERGE_METHOD" "$PR_URL"
